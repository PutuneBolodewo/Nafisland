<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Nafisland (PulauH) — Horizon Island</title>
  <defs>
    <clipPath id="tile">
      <rect x="24" y="24" width="464" height="464" rx="112"/>
    </clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="55%" stop-color="#1C3D72"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <!-- Langit Horizon -->
    <rect x="24" y="24" width="464" height="464" fill="url(#sky)"/>
    <!-- Bintang minimal -->
    <circle cx="118" cy="186" r="5" fill="#E2E8F0" opacity="0.7"/>
    <circle cx="394" cy="168" r="6" fill="#E2E8F0" opacity="0.8"/>
    <circle cx="348" cy="214" r="3.5" fill="#E2E8F0" opacity="0.5"/>
    <!-- Matahari -->
    <circle cx="256" cy="340" r="88" fill="url(#sun)"/>
    <!-- Siluet Pulau -->
    <path d="M24 388 Q156 320 256 356 Q364 394 488 334 L488 488 L24 488 Z" fill="#090D16"/>
    <!-- Notch / Island di tepi atas -->
    <path d="M104 24 Q122 24 122 42 L122 86 Q122 120 156 120 L356 120 Q390 120 390 86 L390 42 Q390 24 408 24 Z" fill="#09090B"/>
    <!-- Aksen media & equalizer di dalam notch -->
    <rect x="148" y="48" width="46" height="46" rx="12" fill="#38BDF8"/>
    <rect x="296" y="64" width="10" height="16" rx="5" fill="#FBBF24"/>
    <rect x="314" y="54" width="10" height="36" rx="5" fill="#FBBF24"/>
    <rect x="332" y="60" width="10" height="24" rx="5" fill="#FBBF24"/>
    <rect x="350" y="50" width="10" height="44" rx="5" fill="#FBBF24"/>
  </g>
</svg>
